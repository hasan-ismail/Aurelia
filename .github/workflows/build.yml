# Builds ModernFlyouts as a portable, self-contained app.
#
# The upstream project shipped only an MSIX bundle, which has to be signed. When that signing
# certificate expired users could no longer install the app at all, and there was no other download
# (see upstream issues #1507, #1494, #1471). The artifacts produced here are plain folders in a zip:
# no certificate, no MSIX, no .NET install required - unzip and run ModernFlyouts.exe.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore ModernFlyouts/ModernFlyouts.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

      - name: Publish (self-contained, portable)
        run: >
          dotnet publish ModernFlyouts/ModernFlyouts.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:Platform=${{ matrix.platform }}
          -o publish/${{ matrix.rid }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/* `
                           -DestinationPath artifacts/ModernFlyouts-portable-${{ matrix.rid }}.zip

      - uses: actions/upload-artifact@v7
        with:
          name: ModernFlyouts-portable-${{ matrix.rid }}
          path: artifacts/*.zip
          if-no-files-found: error

  release:
    # Only publish a GitHub Release when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
