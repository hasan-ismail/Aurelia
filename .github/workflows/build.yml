# Builds Aurelia as a portable, self-contained app.
#
# The original project shipped only an MSIX bundle, which has to be signed. When that signing
# certificate expired users could no longer install the app at all, and there was no other download
# (see upstream issues #1507, #1494, #1471).
#
# This produces two unsigned, self-contained artifacts per architecture, neither of which needs a
# certificate or a .NET install:
#   * Aurelia-Setup-<arch>.exe      - a per-user Inno Setup installer
#   * Aurelia-portable-<rid>.zip    - unzip and run
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
          - rid: win-arm64
            platform: arm64

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore Aurelia/Aurelia.csproj -r ${{ matrix.rid }} -p:Platform=${{ matrix.platform }}

      - name: Publish (self-contained, portable)
        run: >
          dotnet publish Aurelia/Aurelia.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          --no-restore
          -p:Platform=${{ matrix.platform }}
          -o publish/${{ matrix.rid }}

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path publish/${{ matrix.rid }}/* `
                           -DestinationPath artifacts/Aurelia-portable-${{ matrix.rid }}.zip

      - name: Read version
        id: version
        shell: pwsh
        run: |
          # Tag builds are versioned from the tag; everything else uses Directory.Build.props.
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF_NAME -replace '^v',''
          } else {
            $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          }
          # Inno Setup's VersionInfoVersion wants plain numerics, so drop any -beta suffix.
          $v = ($v -split '-')[0]
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "version=$v"

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) { throw "Inno Setup compiler not found at $iscc" }
          & $iscc /DAppVersion=${{ steps.version.outputs.version }} `
                  /DArch=${{ matrix.platform }} `
                  /DPayloadDir=..\publish\${{ matrix.rid }} `
                  installer\Aurelia.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with $LASTEXITCODE" }

      - uses: actions/upload-artifact@v7
        with:
          name: Aurelia-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    # Only publish a GitHub Release when a version tag is pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.zip artifacts/*.exe \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
